spring:
  application:
    name: dragon-trainer
  datasource:
    # Relative to the folder the app is started from (the project root with ./mvnw spring-boot:run).
    # Set MUGLOAR_DB_PATH to use a database somewhere else.
    url: jdbc:sqlite:${MUGLOAR_DB_PATH:data/mugloar.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ## update
      ddl-auto: none


