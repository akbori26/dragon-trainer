# Merges one branch into another from the GitHub web UI: Actions -> Merge branch -> Run workflow.
#
# Only these merges are allowed (see .github/scripts/check-merge-rule.sh):
#   feature/<name>  ->  develop
#   develop         ->  release/BGBNK_<yyyyMMdd>_<NNN>   e.g. release/BGBNK_20261024_001
#
# A release branch that doesn't exist yet is created from main first.
# The merge is tested before it is pushed; on a conflict or a failing test nothing is pushed.
#
# GitHub only shows the "Run workflow" button for workflows on the default branch (main),
# so this file has to be on main.

name: Merge branch

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Branch to merge from: feature/<name> or develop"
        required: true
        type: string
      target:
        description: "Branch to merge into: develop, or release/BGBNK_<yyyyMMdd>_<NNN> for develop"
        required: true
        type: string

permissions:
  contents: write   # to push the merge and create release branches

# One merge per target branch at a time, so two runs can't push over each other
concurrency:
  group: merge-into-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      # Inputs are passed through env vars, never pasted into scripts, so branch names can't inject commands
      SOURCE: ${{ inputs.source }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history and all branches, needed to merge

      - name: Check the branch rule
        run: .github/scripts/check-merge-rule.sh "$SOURCE" "$TARGET"

      - name: Check the source branch exists
        run: |
          if ! git rev-parse --verify --quiet "refs/remotes/origin/$SOURCE" >/dev/null; then
            echo "::error::Source branch '$SOURCE' does not exist."
            exit 1
          fi

      - name: Check out the target branch (create a missing release branch from main)
        run: |
          if git rev-parse --verify --quiet "refs/remotes/origin/$TARGET" >/dev/null; then
            git checkout -B "$TARGET" "origin/$TARGET"
          elif [[ "$TARGET" == release/* ]]; then
            echo "Release branch '$TARGET' does not exist yet; creating it from main."
            git checkout -B "$TARGET" origin/main
          else
            echo "::error::Target branch '$TARGET' does not exist."
            exit 1
          fi

      - name: Merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-ff "origin/$SOURCE" -m "Merge $SOURCE into $TARGET"; then
            echo "::error::'$SOURCE' does not merge cleanly into '$TARGET'. Resolve the conflicts locally or in a pull request."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Test the merged code
        # Live tests call the real game server; they're left out so its outages can't block a merge
        run: ./mvnw -B test -DexcludedGroups=live

      - name: Push
        run: git push origin "HEAD:refs/heads/$TARGET"

      - name: Summary
        run: echo "✅ Merged \`$SOURCE\` into \`$TARGET\`." >> "$GITHUB_STEP_SUMMARY"
